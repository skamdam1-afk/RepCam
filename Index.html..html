.h{font-stretch:125%;font-weight:900;letter-spacing:-.01em;line-height:1.05;margin:0}
.eb{color:var(--tl);font-weight:700;letter-spacing:.22em;font-size:.72rem;text-transform:uppercase}
.mu{color:var(--mu)}.sm{font-size:.82rem}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(160deg,#2aa8ff,#1d56e8);display:grid;place-items:center;font-weight:900;font-stretch:125%;font-size:.8rem;border:2px solid rgba(255,255,255,.2);flex:none}
.cd{display:block;width:100%;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border:1px solid var(--ln);border-radius:22px;padding:16px;margin:14px 0}
.hero{border-radius:34px;border-color:rgba(63,224,204,.2);padding:26px 18px 18px;text-align:center;background:radial-gradient(300px 220px at 50% 35%,rgba(29,109,255,.18),transparent 70%),rgba(255,255,255,.02)}
.hero svg.sk{display:block;width:100%;max-width:270px;height:auto;margin:0 auto;overflow:visible;}.hero .orb{width:84px;height:84px;font-size:2rem;margin:-76px auto 18px;position:relative}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 50% 20%,#35b4ff,#1d56e8 70%);display:grid;place-items:center;font-size:2.6rem;font-stretch:125%;font-weight:900;border:2px solid rgba(255,255,255,.18);box-shadow:0 0 50px rgba(29,109,255,.5)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--bl);color:#fff;border-radius:999px;padding:18px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 8px 34px rgba(29,109,255,.5)}
.lk{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:16px;color:var(--mu)}
.row{display:flex;align-items:center;gap:14px}.sp{justify-content:space-between}
.ring{width:64px;height:64px;flex:none;position:relative}.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.2rem}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:16px;text-align:center}
.db{height:58px;border-radius:14px;background:rgba(255,255,255,.04);margin-bottom:6px}.db.f{background:linear-gradient(180deg,var(--tl),var(--bl));box-shadow:0 0 18px rgba(63,224,204,.3)}
.days span{font-size:.66rem;font-weight:700;letter-spacing:.1em;color:var(--mu)}.days .t{color:var(--tl)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.scr{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.chip{border:1px solid var(--ln);background:rgba(255,255,255,.04);border-radius:999px;padding:9px 16px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--bl);border-color:var(--bl)}.chip.tl.on{background:rgba(63,224,204,.1);border-color:var(--tl);color:var(--tl)}
.seg,.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--ln);border-radius:999px;background:rgba(255,255,255,.03);margin:14px 0}
.seg button,.tabs button{flex:1;padding:11px;border-radius:999px;font-weight:600}
.seg .on{background:var(--bl)}.tabs button{font-size:.8rem;padding:8px;color:var(--mu)}.tabs .on{background:#02050b;color:#fff}
.lb{font-size:.72rem;letter-spacing:.18em;font-weight:700;color:var(--mu);text-transform:uppercase;margin:20px 0 10px}
.st{display:flex;align-items:center;gap:18px;justify-content:center}.st button{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:rgba(255,255,255,.04);display:grid;place-items:center}
.st b{font-size:1.9rem;min-width:44px;text-align:center}
.dash{display:flex;justify-content:center;gap:8px;align-items:center;width:100%;padding:16px;border:1px dashed rgba(255,255,255,.14);border-radius:18px;color:var(--mu);margin:12px 0}
.tg{width:48px;height:28px;border-radius:99px;background:rgba(255,255,255,.15);position:relative;flex:none}.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--bl)}.tg.on:after{left:23px}
.tip{background:rgba(255,255,255,.03);border:1px solid var(--ln);border-radius:14px;padding:10px 14px;margin:8px 0;color:var(--mu);font-size:.88rem}.tip b{color:var(--tx)}
.stk{position:sticky;bottom:calc(88px + env(safe-area-inset-bottom,0px));margin-top:18px}
.sub{text-align:center;font-size:.8rem;color:var(--mu);background:rgba(5,9,18,.85);border:1px solid var(--ln);border-radius:12px;padding:6px;margin-top:8px}
.pill{display:flex;align-items:center;gap:10px;margin:8px 0;padding:14px;border-radius:20px;border:1px solid var(--ln);background:rgba(255,255,255,.03)}
.pill.me{border-color:rgba(63,224,204,.35);box-shadow:0 0 24px rgba(29,109,255,.18)}.pill .n{width:24px;text-align:center;color:var(--mu);font-weight:700}
.pill .r{margin-left:auto;text-align:right;font-size:1.6rem;font-weight:900;font-stretch:125%;line-height:1}.pill .r small{display:block;font-size:.6rem;letter-spacing:.14em;color:var(--mu);font-weight:700}
.gh{display:flex;justify-content:center;gap:8px;align-items:center;width:100%;padding:12px;border:1px solid var(--ln);border-radius:14px;margin:12px 0}
.wk{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end;height:150px;margin-top:16px;text-align:center;font-size:.6rem;color:var(--mu)}
.wk div{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:6px}.wk i{display:block;border-radius:10px;background:rgba(255,255,255,.04);min-height:10px}.wk i.f{background:linear-gradient(180deg,var(--tl),var(--bl))}.wk b{color:var(--tx)}
.rc{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.06);display:grid;place-items:center;text-align:center;font-weight:900;line-height:1}.rc small{display:block;font-size:.5rem;letter-spacing:.1em;color:var(--mu)}
input[type=text]{width:100%;font:inherit;color:var(--tx);background:rgba(255,255,255,.04);border:1px solid var(--ln);border-radius:16px;padding:14px;outline:0}
input:focus{border-color:var(--tl)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(5,9,18,.94);backdrop-filter:blur(14px);border-top:1px solid var(--ln);z-index:5}
nav button{font-family:inherit;flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:18px;border:1px solid transparent;color:var(--mu);text-decoration:none;font-size:.66rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
nav button.on{color:var(--tl);background:rgba(63,224,204,.1);border-color:rgba(63,224,204,.25)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:480px;background:#0b1220;border:1px solid var(--ln);border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet input{margin:6px 0 12px}.sheet .cta{margin-top:10px}
.live{position:fixed;inset:0;background:#000;z-index:30;overflow:hidden}
.live video,.live canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.live.rear video,.live.rear canvas{transform:none}
.live .bar{position:absolute;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top,0px)) 14px;display:flex;justify-content:space-between}
.live .p{background:rgba(5,9,18,.75);border:1px solid var(--ln);border-radius:99px;padding:8px 14px;font-weight:700}
.live .mid{position:absolute;left:0;right:0;bottom:calc(120px + env(safe-area-inset-bottom,0px));text-align:center}.live .orb{margin:0 auto 10px}
.live .ctl{position:absolute;left:14px;right:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}.live .ctl button{flex:1;padding:15px;border-radius:99px;background:rgba(5,9,18,.8);border:1px solid var(--ln);font-weight:700}
.rest{position:absolute;inset:0;background:rgba(5,9,18,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.rest[hidden]{display:none}
button,.chip,.cd{transition:transform .12s ease,background-color .2s,border-color .2s,color .2s,opacity .2s}
button:active:not(:disabled){transform:scale(.97)}button:disabled{opacity:.6}
.fx{animation:fx .22s ease-out}@keyframes fx{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ov{animation:fo .2s}@keyframes fo{from{opacity:0}}.sheet{animation:su .28s cubic-bezier(.2,.8,.2,1)}@keyframes su{from{transform:translateY(40px);opacity:0}}
.pop{animation:pop .18s}@keyframes pop{50%{transform:scale(1.12)}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:448px;margin:0 auto;background:#142036;border:1px solid var(--ln);border-radius:16px;padding:14px;z-index:50;text-align:center;animation:fx .2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#dock{position:fixed;left:0;right:0;bottom:var(--nav,66px);max-width:480px;margin:0 auto;padding:16px 18px 12px;background:linear-gradient(to top,var(--bg) 80%,transparent);z-index:4}#dock[hidden]{display:none}#dock .sub{margin-top:8px;background:#0a1020}#app.hd{padding-bottom:calc(var(--nav,66px) + 116px)}
.adj{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:12px}.adj button{width:54px;height:54px;border-radius:50%;background:rgba(5,9,18,.8);border:1px solid var(--ln);display:grid;place-items:center}.live .adj .orb{margin:0}
#cd{background:rgba(5,9,18,.5);pointer-events:none}#cd .orb{width:150px;height:150px;font-size:4.5rem}
.chip small{font-size:.55rem;letter-spacing:.1em;opacity:.7;margin-left:6px}
:focus-visible{outline:2px solid var(--tl);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<nav>
<button data-go="home" data-n="home"></button><button data-go="workout" data-n="workout"></button><button data-go="social" data-n="social"></button>
</nav>
<div id="dock" hidden></div>
<script type="module">
const P={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',dumb:'<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4.5 1.8 4.5 4.5"/>',play:'<path d="M7 4l13 8-13 8z" fill="currentColor" stroke="none"/>',sl:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',ch:'<path d="M9 6l6 6-6 6"/>',fl:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z" style="stroke:#ff9a3d"/>',cr:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>',pl:'<path d="M12 5v14M5 12h14"/>',mn:'<path d="M5 12h14"/>',se:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',up:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s4 1 5 2M18 8v6M15 11h6"/>',tr:'<path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 20h8"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const EX={pushup:{n:'Push-ups',l:'push-ups',s:'PUSH',tip:'camera on the floor in front, or side-on',L:[11,13,15],R:[12,14,16],lo:95,hi:150},
squat:{n:'Squats',l:'squats',s:'SQUAT',tip:'face or side-on, whole body visible',L:[23,25,27],R:[24,26,28],lo:105,hi:160},
situp:{n:'Sit-ups',l:'sit-ups',s:'SIT',tip:'side-on at floor level',L:[11,23,25],R:[12,24,26],lo:85,hi:140},
lunge:{b:1,n:'Lunges',l:'lunges',s:'LUNGE',tip:'side-on, whole body visible',min:1,lo:105,hi:155},
jack:{b:1,n:'Jumping jacks',l:'jumping jacks',s:'JACK',tip:'face the camera, arms and feet in frame',jack:1,lo:50,hi:150}};
const $=s=>document.querySelector(s),ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}mirror(k,v)};
function idb(){return new Promise((res,rej)=>{const q=indexedDB.open('repcam',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function mirror(k,v){try{idb().then(d=>{d.transaction('kv','readwrite').objectStore('kv').put(JSON.stringify(v),k)}).catch(()=>{})}catch{}}
function idbAll(){try{return idb().then(d=>new Promise(res=>{const c=d.transaction('kv').objectStore('kv').openCursor(),o={};c.onsuccess=()=>{const x=c.result;if(x){o[x.key]=x.value;x.continue()}else res(o)};c.onerror=()=>res({})})).catch(()=>({}))}catch{return Promise.resolve({})}}
let canSave=true;try{localStorage.setItem('rc_t','1');localStorage.removeItem('rc_t')}catch{canSave=false}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VER='2026.11.06';let page='home';let cfg=ld('rc_cfg',{mode:'plan',items:[{ex:'pushup',sets:3,reps:10}],rest:60,voice:true,free:'pushup'}),H=ld('rc_h',[]),me=ld('rc_me',null),fr=ld('rc_f',[]),T={soc:'ranks',per:'week',rx:'pushup'},S=null;
const ini=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const wkS=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getTime()};
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
const days7=ws=>{const a=Array(7).fill(0);H.filter(h=>wkS(h.ts)===ws).forEach(h=>a[(new Date(h.ts).getDay()+6)%7]+=h.total);return a};
function streak(){const s=new Set(H.map(h=>dk(h.ts)));let d=new Date();if(!s.has(dk(d)))d.setDate(d.getDate()-1);let n=0;while(s.has(dk(d))){n++;d.setDate(d.getDate()-1)}return n}
function recs(){const r={};H.forEach(h=>h.sets.forEach(s=>r[s.ex]=Math.max(r[s.ex]||0,s.reps)));return r}
const persist=()=>{if(S)sv('rc_live',{q:S.q.map(x=>({...x,t:x.t===1/0?-1:x.t})),i:S.i,c:S.c,res:S.res,ts:Date.now()})};
addEventListener('pagehide',persist);document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});
const ago=t=>{const h=(Date.now()-t)/36e5;return h<1?'less than an hour ago':h<24?`about ${Math.round(h)} hour${Math.round(h)===1?'':'s'} ago`:`${Math.round(h/24)} days ago`};
const sum=()=>cfg.mode==='free'?`Freestyle ${EX[cfg.free].n}`:cfg.items.map(i=>`${i.sets}×${i.reps} ${EX[i.ex].n}`).join(' + ')+(cfg.rest?` · ${cfg.rest}s rest`:'');
const nSets=()=>cfg.items.reduce((a,i)=>a+i.sets,0);
const setDock=h=>{$('#dock').innerHTML=h||'';$('#dock').hidden=!h;$('#app').classList.toggle('hd',!!h)};
const fit=()=>document.documentElement.style.setProperty('--nav',$('nav').offsetHeight+'px');
addEventListener('resize',fit);
function route(keep){fit();setDock();const h=page;document.querySelectorAll('nav button').forEach(a=>{const n=a.dataset.n;a.classList.toggle('on',n===h);a.innerHTML=ic({home:'home',workout:'dumb',social:'users'}[n])+n});({home,workout,social}[h]||home)();if(!keep){const a=$('#app');a.scrollTop=0;a.classList.remove('fx');void a.offsetWidth;a.classList.add('fx')}if(!me)onboard()}
const go=(p,t)=>{if(t)T.soc=t;page=p;route()};
const hdr=t=>`<div class="top">${t}<button class="av" data-go="social:ranks" aria-label="Profile">${me?ini(me.name):'?'}</button></div>`;

function weekCard(){const ws=wkS(Date.now()),d=days7(ws),nd=d.filter(x=>x).length,wr=d.reduce((a,b)=>a+b,0),st=streak(),td=(new Date().getDay()+6)%7,c=2*Math.PI*26;
return `<div class="cd"><div class="row"><div class="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/><circle cx="32" cy="32" r="26" fill="none" stroke="#3fe0cc" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*Math.min(nd/3,1)} ${c}"/></svg><b>${nd}<small class="mu" style="font-size:.7rem">/3</small></b></div>
<div><div class="eb mu" style="letter-spacing:.18em">THIS WEEK</div><div class="h" style="font-size:1.15rem;margin:4px 0">${nd>=3?'Weekly goal hit':`${3-nd} more day${3-nd>1?'s':''} to goal`}</div><div class="sm mu">${wr} reps &nbsp; <span style="color:#ff9a3d">${ic('fl')}</span> ${st} day streak</div></div></div>
<div class="days">${d.map((v,i)=>`<div><div class="db ${v?'f':''}"></div><span class="${i===td?'t':''}">${'MTWTFSS'[i]}</span></div>`).join('')}</div></div>`}

function home(){const warn=canSave?'':'<div class="tip" style="color:#ff9a3d;margin:0 0 14px"><b>Progress can’t be saved here.</b> This viewer blocks storage. Open the app in Safari, or host it and add it to your Home Screen.</div>';
const bk=H.length&&Date.now()-ld('rc_bk',0)>6048e5?`<div class="cd row sp"><div><b>Back up your progress</b><div class="mu sm">Save a copy to your phone’s Files.</div></div><button class="chip on" data-a="bk">Back up</button></div>`:'';let rs='';const lv=ld('rc_live',null);if(lv&&lv.q&&lv.i<lv.q.length&&(lv.res.length||lv.c>0)){const dn=lv.res.reduce((a,t)=>a+t.reps,0)+lv.c;rs=`<div class="cd" style="border-color:rgba(63,224,204,.35)"><div class="eb">Unfinished workout</div><p class="mu sm" style="margin:8px 0 12px">${lv.res.length} set${lv.res.length===1?'':'s'} done · ${dn} reps so far · ${ago(lv.ts)}</p><button class="cta" data-a="resume">${ic('play')} Resume</button><div class="row sp" style="margin-top:12px"><button class="mu" data-a="savelive">Save what I did</button><button class="mu" data-a="droplive">Discard</button></div></div>`}
const r=recs(),last=H[H.length-1],name=me?me.name.split(' ')[0]:'there';
let lw='';if(last){const by={};last.sets.forEach(s=>by[s.ex]=(by[s.ex]||0)+s.reps);lw=`<button class="cd" data-go="social:history"><div class="row sp"><div><div class="lb" style="margin:0 0 8px">LAST WORKOUT · ${ago(last.ts).toUpperCase()}</div><div class="chips">${Object.entries(by).map(([k,v])=>`<span class="chip on" style="padding:5px 12px">${v} ${EX[k].l}</span>`).join('')}</div></div>${ic('ch')}</div></button>`}
$('#app').innerHTML=`${hdr('<span class="eb">● Repcam</span>')}
<h1 class="h" style="font-size:2.9rem;margin:6px 0 22px">Hey ${esc(name)},<br><span style="color:var(--bl)">ready to move?</span></h1>
${warn}${rs}${bk}<div class="cd hero"><svg class="sk" viewBox="200 250 856 760" role="img" aria-label="Push-up inside a camera frame"><defs><linearGradient id="bk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00f6ff"/><stop offset="1" stop-color="#1d6dff"/></linearGradient><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cfe2ff"/></linearGradient><linearGradient id="sl" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#1d6dff" stop-opacity="0"/><stop offset=".5" stop-color="#3b8bff"/><stop offset="1" stop-color="#1d6dff" stop-opacity="0"/></linearGradient></defs><g fill="none" stroke="url(#bk)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"><path d="M457 288H331A90 90 0 0 0 241 378V490"/><path d="M798 288H924A90 90 0 0 1 1014 378V490"/><path d="M241 800V878A90 90 0 0 0 331 968H457"/><path d="M1014 800V878A90 90 0 0 1 924 968H798"/></g><path d="M200 764H1056" stroke="url(#sl)" stroke-width="6"/><g fill="url(#fg)" stroke="url(#fg)" stroke-width="8" stroke-linejoin="round"><circle cx="886" cy="517" r="56"/><path d="M290 690L500 615L560 585L690 535L760 508L790 510L815 545L822 650L843 735L898 745L900 760L808 760L755 625L740 592L705 628L660 665L590 670L540 675L330 715L325 735L355 757L355 760L300 758L277 745L275 720Z"/></g></svg>
<div class="orb">0</div>
<div class="sm"><span class="eb" style="font-size:.82rem">Quick start</span> <span class="mu">· ${esc(sum())}</span></div>

case'droplive':if(confirm('Discard this unfinished workout?')){sv('rc_live',null);re()}break;case'adj':adj(+v);break;case'skip':endRest();break;case'fin':stop(true);break;case'done':a.closest('.ov').remove();go('home');break}});

async function engineLoad(){if(LM)return;const B='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',V=await import(B+'/vision_bundle.mjs'),f=await V.FilesetResolver.forVisionTasks(B+'/wasm'),base={modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'};

const openCam=async()=>{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:cam,width:{ideal:640},height:{ideal:480}},audio:false})};
const kill=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null};
const ang=(a,b,c)=>{let d=Math.abs((Math.atan2(c.y-b.y,c.x-b.x)-Math.atan2(a.y-b.y,a.x-b.x))*180/Math.PI);return d>180?360-d:d};
function metric(e,L){const vis=ids=>ids.reduce((a,i)=>a+(L[i].visibility??0),0)/ids.length;
if(e.jack){if(vis([11,12,15,16,27,28])<.5)return;const sw=Math.abs(L[11].x-L[12].x)||.1,up=L[15].y<L[11].y&&L[16].y<L[12].y,w=Math.abs(L[27].x-L[28].x)/sw;return up&&w>1.5?0:!up&&w<1.2?200:null}
if(e.min){if(vis([23,24,25,26,27,28])<.5)return;return Math.min(ang(L[23],L[25],L[27]),ang(L[24],L[26],L[28]))}
const l=vis(e.L),r=vis(e.R);if(Math.max(l,r)<.5)return;const k=l>=r?e.L:e.R;return ang(L[k[0]],L[k[1]],L[k[2]])}
let wl;const lock=async()=>{try{wl=await navigator.wakeLock.request('screen')}catch{}},unlock=()=>{try{wl&&wl.release()}catch{}wl=null};

const q=resume?resume.q.map(x=>({...x,t:x.t<0?1/0:x.t})):[];if(resume);else if(cfg.mode==='free')q.push({ex:cfg.free,t:1/0,set:1,of:1,free:1});else cfg.items.forEach(it=>{for(let s=1;s<=it.sets;s++)q.push({ex:it.ex,t:it.reps,set:s,of:it.sets})});
S={q,i:resume?resume.i:0,c:resume?resume.c:0,ph:'up',ema:null,res:resume?resume.res:[],rest:0,tm:0,ct:0,paused:0,hold:0,lr:0,msg:'',el:null};
document.body.insertAdjacentHTML('beforeend',`<div class="live ${cam==='user'?'':'rear'}" id="lv"><video id="vid" playsinline muted></video><canvas id="cv"></canvas>
<div class="bar"><span class="p" id="hx"></span><span class="p" id="hs"></span></div><div class="mid"><div class="adj"><button data-a="adj" data-v="-1" aria-label="Remove one rep">${ic('mn')}</button><div class="orb" id="cn"></div><button data-a="adj" data-v="1" aria-label="Add one rep">${ic('pl')}</button></div><div class="p" id="stt" style="display:inline-block">Get in position</div></div>

S.el={v:$('#vid'),cv:$('#cv'),cn:$('#cn'),stt:$('#stt'),g:$('#cv').getContext('2d')};
labels();const v=S.el.v;v.srcObject=stream;try{await v.play()}catch{}lastT=-1;lock();starting=false;loop();countdown()}
function labels(){const q=S.q[S.i];$('#hx').textContent=EX[q.ex].n;$('#hs').textContent=q.free?'Freestyle':`Set ${q.set}/${q.of}`;$('#cn').textContent=S.c}
async function flip(){cam=cam==='user'?'environment':'user';kill();try{await openCam();$('#vid').srcObject=stream;$('#lv').classList.toggle('rear',cam!=='user')}catch{}}
const info=t=>{if(S&&S.msg!==t){S.msg=t;S.el.stt.textContent=t}};
function loop(){if(!S)return;raf=requestAnimationFrame(loop);const E=S.el,v=E.v;if(v.readyState<2||v.currentTime===lastT)return;lastT=v.currentTime;
const r=LM.detectForVideo(v,performance.now()),cv=E.cv,g=E.g,L=r.landmarks[0];
if(cv.width!==v.videoWidth||cv.height!==v.videoHeight){cv.width=v.videoWidth;cv.height=v.videoHeight;g.strokeStyle='#3fe0cc';g.fillStyle='#d8fff9';g.lineWidth=4;g.shadowColor='#3fe0cc';g.shadowBlur=10}
g.clearRect(0,0,cv.width,cv.height);
if(!L){info('Step back so your whole body is in frame');return}
LM._c.forEach(({start:a,end:b})=>{if(L[a].visibility<.4||L[b].visibility<.4)return;g.beginPath();g.moveTo(L[a].x*cv.width,L[a].y*cv.height);g.lineTo(L[b].x*cv.width,L[b].y*cv.height);g.stroke()});

if(S.rest>0||S.paused)return;if(S.hold){info('Get ready');return}const q=S.q[S.i],e=EX[q.ex];let m=metric(e,L);if(m===undefined){info('Turn so your body is visible to the camera');return}if(m===null)return;
if(!e.jack){S.ema=S.ema==null?m:S.ema*.6+m*.4;m=S.ema}info('Tracking');
if(S.ph==='up'&&m<e.lo)S.ph='down';else if(S.ph==='down'&&m>e.hi){S.ph='up';const t=performance.now();if(t-S.lr<350)return;S.lr=t;S.c++;persist();E.cn.textContent=S.c;E.cn.classList.remove('pop');void E.cn.offsetWidth;E.cn.classList.add('pop');navigator.vibrate&&navigator.vibrate(25);say(String(S.c));if(S.c>=q.t)finishSet()}}
function finishSet(){const q=S.q[S.i];S.res.push({ex:q.ex,reps:S.c});S.c=0;S.ph='up';S.ema=null;S.i++;persist();
if(S.i>=S.q.length){say('Workout complete',1000);return stop(true)}say('Set complete',1000);
if(cfg.rest>0){S.rest=cfg.rest;const n=S.q[S.i];$('#rs').hidden=false;$('#rt').textContent=S.rest;$('#nx').textContent=`Next: ${EX[n.ex].n} · set ${n.set}/${n.of}`;S.tm=setInterval(()=>{if(S.paused)return;S.rest--;$('#rt').textContent=S.rest;if(S.rest<=0)endRest()},1000)}else{labels();countdown()}}
